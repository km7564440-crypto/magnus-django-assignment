{% extends "base.html" %}
{% block content %}
<div class="page-title">Delete Employee</div>
<div class="card">
  <h2>Confirm Delete</h2>
  <p>Are you sure you want to delete <b>{{ employee.first_name }} {{ employee.last_name }}</b>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, Delete</button>
    <a class="btn" href="{% url 'employee_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
